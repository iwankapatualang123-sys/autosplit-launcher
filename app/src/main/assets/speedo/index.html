        <stop offset="1" style="stop-color: var(--theme-accent-2)" />

        <stop offset="0" style="stop-color: var(--theme-accent)" />
        <stop offset="1" style="stop-color: var(--theme-accent-2)" />

      <linearGradient id="elioSpeedTextGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0.2" stop-color="#FFFFFF" />
        <stop offset="0.7" style="stop-color: var(--theme-accent)" />
        <stop offset="1" style="stop-color: var(--theme-accent-2)" />
      </linearGradient>
    </defs>

      <div class="speedo-grid"><div class="speedo-grid-plane"></div></div>
      <div class="speedo-vignette"></div>

<script>
(function () {
  function set(sel, v) {
    if (v === undefined || v === null) return;
    v = String(v);
    document.querySelectorAll(sel).forEach(function (e) { if (e.textContent !== v) e.textContent = v; });
  }
  function tpl(sel, token, v) {
    if (v === undefined || v === null) return;
    document.querySelectorAll(sel).forEach(function (e) {
      if (!e.getAttribute('data-tpl')) e.setAttribute('data-tpl', e.textContent);
      var t = e.getAttribute('data-tpl').replace(token, v);
      if (e.textContent !== t) e.textContent = t;
    });
  }
  window.ElioBridge = {
    live: function (d) {
      set('.live-trip-km', d.trip); set('.live-alt-num', d.alt); set('.live-heading-val', d.head);
      set('.live-sats-val', d.sats); set('.live-gnss-status', d.gnss); set('.live-max', d.max);
      set('.live-avg', d.avg); set('.live-btemp', d.btemp); set('.live-time', d.time);
      tpl('.live-acc-status', 'ACTIVE', d.acc); tpl('.live-battery-status', '--', d.bat);
      set('.live-sats-num', String(d.sats || '').replace(/^[^\x00-\x7F]+\s*/, '').replace(/\s*SATS$/, ''));
      set('.live-m3info', 'ALT ' + d.alt + ' m  \u2022  ' + d.head + '  \u2022  ' + String(d.sats || '').replace(/^[^\x00-\x7F]+\s*/, ''));
    }
  };
})();
</script>
